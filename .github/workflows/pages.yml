name: Deploy static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare GitHub Pages UID relay
        id: uid
        run: node scripts/configure-uid-worker.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UID_API_BASE_URL: ${{ vars.UID_API_BASE_URL }}
          UID_SITE_ORIGIN: ${{ vars.UID_SITE_ORIGIN }}
          UID_WORKER_NAME: ${{ vars.UID_WORKER_NAME }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
      - name: Deploy UID relay to Cloudflare
        if: steps.uid.outputs.deploy_worker == 'true'
        id: uid-worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.136.3'
          command: deploy --config tmp/uid-deploy/wrangler.json
      - name: Verify deployed UID relay
        run: node scripts/verify-uid-deployment.mjs
        env:
          UID_API_BASE_URL: ${{ steps.uid.outputs.api_base_url }}
          UID_WORKER_URL: ${{ steps.uid-worker.outputs.deployment-url }}
          UID_SITE_ORIGIN: ${{ steps.uid.outputs.site_origin }}
      - name: Build Pages with deployed UID relay URL
        run: npm run build
        env:
          UID_API_BASE_URL: ${{ steps.uid.outputs.api_base_url }}
          UID_WORKER_URL: ${{ steps.uid-worker.outputs.deployment-url }}
          UID_REQUIRE_PUBLIC: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
