spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:honkai;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${TEST_DB_USERNAME:sa}
    password: ${TEST_DB_PASSWORD:}
  jpa:
    properties:
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
app:
  allowed-origins: https://example.github.io
  session:
    cookie-secure: false
