server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/honkai?connectionTimeZone=UTC}
    username: ${DB_USERNAME:honkai}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
app:
  allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
