server:
  port: ${PORT:8080}
spring:
  mvc:
    log-request-details: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/honkai?connectionTimeZone=UTC}
    username: ${DB_USERNAME:honkai}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
app:
  allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
  session:
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
    same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
    hours: ${SESSION_HOURS:12}
    absolute-days: ${SESSION_ABSOLUTE_DAYS:30}
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.hibernate.orm.jdbc.bind: OFF
    org.springframework.web: INFO
    org.springframework.security: INFO
